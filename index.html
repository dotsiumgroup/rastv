<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAS TV – Preloader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { background: #035c4a; }

    #preloader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #035c4a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 999999;
      transition: opacity 1.5s ease, transform 1.5s ease;
    }

    .brand {
      font-size: 8.4vw;
      font-weight: 900;
      color: #ffd700;
      letter-spacing: 0.15em;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
      opacity: 0;
      transform: scale(0.8);
      animation: zoomIn 1.2s ease-out forwards 0.4s;
      font-family: 'Segoe UI', sans-serif;
    }

    .tagline {
      font-size: 2.2vw;
      font-weight: 700;
      color: #bbb;
      letter-spacing: 0.4em;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1.2s ease-out forwards 1.2s;
      text-transform: uppercase;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 0 20px;
    }

    .line {
      position: absolute;
      background: linear-gradient(to right, transparent, #ffd700, transparent);
      height: 1px;
      width: 0;
      transition: width 1.2s ease-in-out;
    }
    .line.left  { left: 0;  top: 50%; }
    .line.right { right: 0; top: 50%; }

    @keyframes zoomIn {
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .loaded #preloader {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div id="preloader">
    <div class="line left"></div>
    <div class="line right"></div>
    <div class="brand"  id="brand">.SIUM GROUP</div>
    <div class="tagline" id="tagline">Crafted with Excellence</div>
  </div>

  <script>
    (function () {

      /* --- Step 1: expand lines --- */
      setTimeout(() => {
        document.querySelectorAll('.line').forEach(l => l.style.width = '40%');
      }, 300);

      /* --- Step 2: fade out first slide --- */
      setTimeout(() => {
        const brand   = document.getElementById('brand');
        const tagline = document.getElementById('tagline');
        brand.style.transition   = 'opacity 0.8s ease';
        tagline.style.transition = 'opacity 0.8s ease';
        brand.style.opacity   = 0;
        tagline.style.opacity = 0;
      }, 2200);

      /* --- Step 3: show second slide --- */
      setTimeout(() => {
        const brand   = document.getElementById('brand');
        const tagline = document.getElementById('tagline');

        brand.innerHTML   = 'RAS TV';
        tagline.innerHTML = 'Recommended by Sahibul Musa Sium';

        brand.style.opacity   = 0;
        brand.style.transform = 'scale(0.8)';
        tagline.style.opacity   = 0;
        tagline.style.transform = 'translateY(20px)';

        brand.style.animation   = 'none';
        tagline.style.animation = 'none';

        brand.offsetHeight;   /* force reflow */
        tagline.offsetHeight;

        brand.style.animation   = 'zoomIn 1.2s ease-out forwards';
        tagline.style.animation = 'fadeUp 1.2s ease-out forwards 0.4s';
      }, 3200);

      /* --- Step 4: redirect to target site --- */
      setTimeout(() => {
        window.location.href = 'https://livekhela.tv/';
      }, 6500);

    })();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>RAS TV</title>
    <link rel="shortcut icon" type="image/x-icon" href="https://i.postimg.cc/W133vv3S/file-00000000da6472098c023a1c13aaad41.png" />

    <!-- JW Player -->
    <script src="https://content.jwplatform.com/libraries/SAHhwvZq.js">
    </script>
    <script>
        jwplayer.key = "zTEbSn/eAplL0RLXT030FzOcek6qXmtrxju6Jg==";
    </script>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #035c4a;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #fff;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }

        /* ---------- PRELOADER ---------- */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #035c4a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 999999;
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        .brand {
            font-size: 8.4vw;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.15em;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            opacity: 0;
            transform: scale(0.8);
            animation: zoomIn 1.2s ease-out forwards 0.4s;
        }

        .tagline {
            font-size: 2.2vw;
            font-weight: 700;
            color: #bbb;
            letter-spacing: 0.4em;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1.2s ease-out forwards 1.2s;
            text-transform: uppercase;
        }

        .line {
            position: absolute;
            background: linear-gradient(to right, transparent, #ffd700, transparent);
            height: 1px;
            transition: width 1.2s ease-in-out;
        }
        .line.left {
            left: 0;
            top: 50%;
        }
        .line.right {
            right: 0;
            top: 50%;
        }

        @keyframes zoomIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loaded #preloader {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        /* ---------- MAIN CONTENT ---------- */
        #main-content {
            display: none;
            background: #000;
            overflow-x: hidden;
            padding: 10px 0 20px 0;
            min-height: 100vh;
            -webkit-overflow-scrolling: touch;
        }

        /* ---------- TV VIEW ---------- */
        .tv-view {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 10px;
        }

        /* ===== লেআউট গ্রিড ===== */
        .tv-layout-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto auto;
        }

        .tv-layout-grid .video-col {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
        }
        .tv-layout-grid .fifa-col {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }
        .tv-layout-grid .news-col {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
        }
        .tv-layout-grid .indian-col {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
        }

        /* ===== ভিডিও কলাম (JW Player) ===== */
        .video-col .player-wrapper {
            background: #000;
            border-radius: 12px 12px 0 0;
            overflow: hidden;
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
            aspect-ratio: 16 / 9;
            border: 1px solid #222;
            border-bottom: none;
        }

        .video-col .player-wrapper .jwplayer {
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== প্লেয়ারের নিচের স্ট্যাটাস বার ===== */
        .player-status-bar {
            background: linear-gradient(180deg, #0e0e1a, #1a1a2e);
            border: 1px solid #2a2a44;
            border-top: none;
            border-radius: 0 0 12px 12px;
            padding: 8px 14px 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.8);
            margin-bottom: 4px;
            min-height: 44px;
        }

        .player-status-bar .status-text {
            font-size: 12px;
            font-weight: 400;
            color: #aaa;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 100px;
        }

        .player-status-bar .status-text .spinner-mini {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spinMini 0.8s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spinMini {
            to {
                transform: rotate(360deg);
            }
        }

        .player-status-bar .status-text .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ff1744;
            border-radius: 50%;
            animation: livePulse 1.2s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes livePulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .player-status-bar .status-text .channel-name {
            color: #ffd700;
            font-weight: 600;
        }

        .player-status-bar .status-text .url-short {
            color: #666;
            font-size: 10px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-status-bar .status-text.error {
            color: #ff6b6b;
        }
        .player-status-bar .status-text.success {
            color: #69db7c;
        }

        .player-status-bar .status-icons {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .player-status-bar .status-icons .badge-ras {
            font-size: 9px;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            padding: 2px 10px;
            border-radius: 30px;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        /* ===== চ্যানেল বক্স ===== */
        .channel-box {
            background: linear-gradient(145deg, #0e0e1a, #1a1a2e);
            border-radius: 16px;
            padding: 12px 10px 14px 10px;
            border: 1px solid #2a2a44;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            transition: border-color 0.3s ease, transform 0.2s ease;
            height: 100%;
        }

        .channel-box:hover {
            border-color: #ff9100;
            transform: translateY(-2px);
        }

        .channel-box .box-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding-bottom: 5px;
            border-bottom: 2px solid rgba(255, 145, 0, 0.25);
        }

        .channel-box .box-title {
            font-size: clamp(11px, 1.4vw, 16px);
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .channel-box .box-title .box-icon-big {
            font-size: clamp(14px, 2vw, 22px);
            opacity: 0.9;
            filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.2));
        }

        .channel-box .box-title .badge-count {
            font-size: 9px;
            background: linear-gradient(135deg, #ff9100, #ffcc00);
            color: #000;
            padding: 0 8px;
            border-radius: 30px;
            font-weight: 700;
            letter-spacing: 0.3px;
            box-shadow: 0 0 20px rgba(255, 145, 0, 0.3);
            line-height: 1.7;
        }

        .channel-box .box-icon {
            font-size: 14px;
            opacity: 0.4;
        }

        /* ---- গ্রিড : ৪ কলাম (নিউজ ও ইন্ডিয়ান) ---- */
        .news-col .stream-grid,
        .indian-col .stream-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }

        /* ---- গ্রিড : ৩ কলাম (ফিফা) ---- */
        .fifa-col .stream-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
        }

        /* ---- ছোট বাটন ---- */
        .stream-btn {
            position: relative;
            background: linear-gradient(145deg, #1c1c30, #12121e);
            border: 1.5px solid #333355;
            border-radius: 8px;
            padding: 5px 2px 4px 2px;
            text-align: center;
            font-size: 7px;
            font-weight: 700;
            color: #ddd;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.5);
            white-space: normal;
            word-break: break-word;
            line-height: 1.1;
            min-height: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            user-select: none;
            gap: 1px;
        }

        .stream-btn .sub-label {
            display: block;
            font-size: 5px;
            font-weight: 400;
            opacity: 0.5;
            margin-top: 0px;
            text-transform: none;
            letter-spacing: 0.1px;
        }

        .stream-btn .btn-icon {
            font-size: 12px;
            margin-bottom: 0px;
            opacity: 0.8;
            line-height: 1;
        }

        .stream-btn.active {
            border-color: #ff9100;
            background: linear-gradient(145deg, #ff9100, #e07c00);
            color: #000;
            box-shadow: 0 0 28px rgba(255, 145, 0, 0.6);
            transform: scale(1.04);
        }

        .stream-btn.active .btn-icon {
            opacity: 1;
        }

        .stream-btn:focus {
            outline: 2px solid #ffd700;
            outline-offset: 2px;
        }

        .stream-btn:hover {
            transform: scale(1.05);
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .stream-btn:active {
            transform: scale(0.95);
        }

        /* ===== স্ট্যাটাস ডট ===== */
        .status-dot {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #0e0e1a;
            z-index: 5;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
            background: #666;
        }

        .status-dot.on {
            background: #00c853;
            border-color: #00e676;
            box-shadow: 0 0 14px rgba(0, 200, 83, 0.6);
        }

        .status-dot.off {
            background: #d50000;
            border-color: #ff1744;
            box-shadow: 0 0 14px rgba(213, 0, 0, 0.6);
        }

        .status-dot.checking {
            background: #ff9100;
            border-color: #ffab40;
            box-shadow: 0 0 14px rgba(255, 145, 0, 0.5);
            animation: dotPulse 0.7s ease-in-out infinite alternate;
        }

        .status-dot .dot-label {
            font-size: 4px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: 0.2px;
            color: #fff;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
        }

        @keyframes dotPulse {
            0% {
                transform: scale(0.85);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        /* ===== স্ট্যাটাস লেজেন্ড ===== */
        .status-legend {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: flex-end;
            padding: 3px 8px 5px 8px;
            max-width: 1200px;
            margin: 0 auto;
            font-size: 8px;
            color: #aaa;
            flex-wrap: wrap;
        }

        .status-legend .legend-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .status-legend .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-legend .legend-dot.on {
            background: #00c853;
        }
        .status-legend .legend-dot.off {
            background: #d50000;
        }
        .status-legend .legend-dot.checking {
            background: #ff9100;
            animation: dotPulse 0.7s ease-in-out infinite alternate;
        }

        @media (max-width: 520px) {
            .status-legend {
                font-size: 6px;
                gap: 6px;
                padding: 2px 4px 4px 4px;
            }
            .status-legend .legend-dot {
                width: 7px;
                height: 7px;
            }
        }

        /* ===== ফুটার ===== */
        .footer-premium {
            background: #0a0a0a;
            padding: 18px 0 24px 0;
            text-align: center;
            margin-top: 14px;
            border-top: 2px solid #1a1a1a;
        }

        .footer-premium .ras-brand {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ff9100, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 3px;
            text-shadow: 0 0 40px rgba(255, 145, 0, 0.1);
        }

        .footer-premium .developer {
            font-size: 12px;
            font-weight: 500;
            color: #ccc;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .footer-premium .developer span {
            background: linear-gradient(90deg, #ff9100, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        .others-platform-box {
            display: inline-block;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 8px 14px 10px;
            margin-top: 4px;
            background: #111;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
        }

        .others-platform-box .box-title {
            font-size: 8px;
            font-weight: 600;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .others-platform-box .server-buttons {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 6px;
        }

        .others-platform-box .server-btn {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            border-color: #ff9100;
            box-shadow: 0 0 14px rgba(255, 145, 0, 0.2);
            white-space: nowrap;
        }

        .others-platform-box .server-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 0 28px rgba(255, 145, 0, 0.5);
            background: linear-gradient(135deg, #ff9100, #ffcc00);
            color: #000;
            border-color: #ffcc00;
        }

        .others-platform-box .server-btn.server-2 {
            border-color: #00d2ff;
            box-shadow: 0 0 14px rgba(0, 210, 255, 0.2);
        }

        .others-platform-box .server-btn.server-2:hover {
            box-shadow: 0 0 28px rgba(0, 210, 255, 0.5);
            background: linear-gradient(135deg, #00d2ff, #00ff88);
            border-color: #00ff88;
            color: #000;
        }

        .footer-premium .copyright {
            color: #444;
            font-size: 8px;
            margin-top: 12px;
            letter-spacing: 1px;
        }

        .footer-premium .copyright span {
            color: #ff9100;
        }

        /* ===== রেস্পন্সিভ ===== */
        @media (max-width: 820px) {
            .tv-layout-grid {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
            .tv-layout-grid .video-col {
                grid-column: 1 / 2;
                grid-row: 1 / 2;
            }
            .tv-layout-grid .fifa-col {
                grid-column: 1 / 2;
                grid-row: 2 / 3;
            }
            .tv-layout-grid .news-col {
                grid-column: 1 / 2;
                grid-row: 3 / 4;
            }
            .tv-layout-grid .indian-col {
                grid-column: 1 / 2;
                grid-row: 4 / 5;
            }
            .fifa-col .stream-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .news-col .stream-grid,
            .indian-col .stream-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 600px) {
            .stream-grid {
                gap: 4px;
            }
            .stream-btn {
                font-size: 6px;
                padding: 4px 1px 3px 1px;
                min-height: 26px;
                border-radius: 6px;
                border-width: 1px;
            }
            .stream-btn .sub-label {
                font-size: 4px;
            }
            .stream-btn .btn-icon {
                font-size: 10px;
            }
            .status-dot {
                width: 12px;
                height: 12px;
                top: -3px;
                right: -3px;
                font-size: 4px;
                border-width: 1.5px;
            }
            .status-dot .dot-label {
                font-size: 3px;
            }
            .channel-box {
                padding: 8px 6px 10px 6px;
                border-radius: 10px;
            }
            .player-status-bar {
                padding: 6px 10px 8px 10px;
                min-height: 36px;
            }
            .player-status-bar .status-text {
                font-size: 10px;
            }
            .player-status-bar .status-text .url-short {
                max-width: 100px;
            }
            .player-status-bar .status-icons .badge-ras {
                font-size: 7px;
                padding: 1px 8px;
            }
        }

        @media (max-width: 420px) {
            .stream-btn {
                font-size: 5px;
                padding: 3px 1px 2px 1px;
                min-height: 22px;
                border-radius: 4px;
                border-width: 1px;
                gap: 0px;
            }
            .stream-btn .btn-icon {
                font-size: 8px;
            }
            .stream-btn .sub-label {
                font-size: 3px;
            }
            .status-dot {
                width: 10px;
                height: 10px;
                top: -2px;
                right: -2px;
                font-size: 3px;
                border-width: 1px;
            }
            .status-dot .dot-label {
                font-size: 2px;
            }
            .channel-box .box-title {
                font-size: 9px;
            }
            .channel-box .box-title .badge-count {
                font-size: 7px;
                padding: 0 6px;
                line-height: 1.5;
            }
            .player-status-bar .status-text {
                font-size: 9px;
            }
            .player-status-bar .status-text .url-short {
                max-width: 70px;
            }
            .player-status-bar .status-icons .badge-ras {
                font-size: 6px;
                padding: 1px 6px;
            }
        }

        @media (min-width: 601px) and (max-width: 820px) {
            .stream-btn {
                font-size: 7px;
                padding: 5px 2px 4px 2px;
                min-height: 30px;
            }
            .stream-btn .btn-icon {
                font-size: 11px;
            }
            .stream-btn .sub-label {
                font-size: 4.5px;
            }
        }

        @media (min-width: 821px) and (max-width: 1024px) {
            .fifa-col .stream-grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .news-col .stream-grid,
            .indian-col .stream-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="line left"></div>
        <div class="line right"></div>
        <div class="brand" id="brand">.SIUM GROUP</div>
        <div class="tagline" id="tagline">Crafted with Excellence</div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content">
        <div class="container tv-area">
            <div class="row">
                <div class="col-xs-12 tv-view">

                    <!-- ===== লেআউট গ্রিড ===== -->
                    <div class="tv-layout-grid" id="layoutGrid">

                        <!-- === ভিডিও কলাম (JW Player) === -->
                        <div class="video-col" id="videoCol">
                            <div class="player-wrapper" id="playerWrapper">
                                <div id="video_player"></div>
                            </div>

                            <!-- ===== প্লেয়ার স্ট্যাটাস বার ===== -->
                            <div class="player-status-bar" id="playerStatusBar">
                                <div class="status-text" id="statusText">
                                    <span class="live-dot"></span>
                                    <span>প্রস্তুত — একটি চ্যানেল সিলেক্ট করুন</span>
                                </div>
                                <div class="status-icons">
                                    <span class="badge-ras">RAS TV</span>
                                </div>
                            </div>

            // ফিফা চ্যানেল: নতুন + পুরনো (নতুনগুলো প্রথমে)
            const fifaStreams = fifaNewChannels.concat(fifaOldChannels);

            const CHANNELS = [{
                id: 'fifa',
                name: 'FIFA LIVE TV',
                icon: '⚽',
                streams: fifaStreams
            }, {
                id: 'bangladeshi',
                name: 'Bangladeshi News Channels',
                icon: '🇧🇩',
                streams: existingBangladeshi.concat(
                    banglaNew.map(item => ({
                        label: item.name,
                        sub: item.sub || '',
                        icon: item.icon || '📺',
                        urls: item.urls
                    }))
                )
            }, {
                id: 'international',
                name: 'International Channels',
                icon: '🌍',
                streams: orderedForeign.map(item => ({
                    label: item.name,
                    sub: item.sub || '',
                    icon: item.icon || '📺',
                    urls: item.urls
                }))
            }];

            // ===== allStreams ফ্ল্যাট =====
            let allStreams = [];
            CHANNELS.forEach(ch => {
                ch.streams.forEach(s => {
                    allStreams.push({
                        channelName: ch.name,
                        label: s.label,
                        sub: s.sub || '',
                        icon: s.icon || '📺',
                        urls: s.urls || []
                    });
                });
            });

            // ===== এলিমেন্ট =====
            const fifaCol = document.getElementById('fifaCol');
            const newsCol = document.getElementById('newsCol');
            const indianCol = document.getElementById('indianCol');
            const statusText = document.getElementById('statusText');
            const playerWrapper = document.getElementById('playerWrapper');

            let currentStreamIndex = -1;
            let isPlaying = false;
            let statusCheckTimers = [];

            // ===== স্ট্যাটাস ট্র্যাকিং =====
            const statusCache = new Map();
            const firstCheckDone = new Set();

            // প্রতিটি চ্যানেলের জন্য retry state
            const retryState = new Map(); // index -> { attempt: 0, timer: null }

            // ===== স্ট্যাটাস বার =====
            function setStatus(msg, type, channelName) {
                const dot = statusText.querySelector('.live-dot');
                const textSpan = statusText.querySelector('span:last-child') || statusText;
                if (type === 'loading') {
                    statusText.className = 'status-text';
                    statusText.innerHTML =
                        `<span class="spinner-mini"></span><span>${msg}</span>`;
                } else if (type === 'error') {
                    statusText.className = 'status-text error';
                    statusText.innerHTML =
                        `<span>⚠️ ${msg}</span>`;
                } else if (type === 'playing') {
                    statusText.className = 'status-text success';
                    const name = channelName ? `<span class="channel-name">${channelName}</span>` : '';
                    statusText.innerHTML =
                        `<span class="live-dot"></span><span>▶ ${msg} ${name}</span>`;
                } else {
                    statusText.className = 'status-text';
                    statusText.innerHTML =
                        `<span class="live-dot"></span><span>${msg}</span>`;
                }
            }

            // ===== JW Player =====
            let player = null;

            function initJWPlayer(initialUrl) {
                try {
                    player = jwplayer('video_player').setup({
                        file: initialUrl || '',
                        type: 'hls',
                        width: '100%',
                        height: '100%',
                        autostart: false,
                        preload: 'metadata',
                        skin: {
                            name: 'glow',
                            active: '#ffd700'
                        },
                        controls: true,
                        primary: 'html5',
                        hlshtml: true,
                    });

                    player.on('ready', function() {
                        if (currentStreamIndex >= 0) {
                            const stream = allStreams[currentStreamIndex];
                            if (stream) {
                                setStatus('প্রস্তুত', 'playing', stream.label);
                            }
                        } else {
                            setStatus('প্রস্তুত — একটি চ্যানেল সিলেক্ট করুন', '');
                        }
                    });

                    player.on('play', function() {
                        isPlaying = true;
                        if (currentStreamIndex >= 0) {
                            const stream = allStreams[currentStreamIndex];
                            if (stream) {
                                setStatus('চলছে', 'playing', stream.label);
                            }
                        }
                    });

                    player.on('pause', function() {
                        isPlaying = false;
                        if (currentStreamIndex >= 0) {
                            const stream = allStreams[currentStreamIndex];
                            if (stream) {
                                setStatus('থামানো হয়েছে', '', stream.label);
                            }
                        }
                    });

                    player.on('buffer', function() {
                        setStatus('বাফারিং...', 'loading');
                    });

                    player.on('error', function(e) {
                        const msg = e.message || 'প্লে করতে সমস্যা';
                        setStatus('❌ ' + msg, 'error');
                        if (currentStreamIndex >= 0) {
                            const stream = allStreams[currentStreamIndex];
                            if (stream && stream.urls && stream.urls.length > 1) {
                                tryFallback(currentStreamIndex);
                            }
                        }
                    });

                    player.on('complete', function() {
                        setStatus('সমাপ্ত', '');
                    });

                    return player;
                } catch (err) {
                    console.error('JW Player init error:', err);
                    setStatus('❌ প্লেয়ার লোড হয়নি', 'error');
                    return null;
                }
            }

            // ===== ফালব্যাক =====
            let fallbackAttempted = false;

            function tryFallback(index) {
                if (fallbackAttempted) return;
                const stream = allStreams[index];
                if (!stream || !stream.urls || stream.urls.length < 2) return;
                fallbackAttempted = true;
                const url = stream.urls[1];
                if (url) {
                    setStatus('ফালব্যাক চেষ্টা...', 'loading');
                    player.load({ file: url, type: 'hls' });
                    setTimeout(() => {
                        player.play();
                    }, 500);
                }
            }

            // ===== স্ট্রিম লোড =====
            function loadStream(index) {
                const stream = allStreams[index];
                if (!stream || !stream.urls || stream.urls.length === 0) {
                    setStatus('❌ স্ট্রিম পাওয়া যায়নি', 'error');
                    return;
                }

                const url = stream.urls[0];
                if (!url) {
                    setStatus('❌ URL নেই', 'error');
                    return;
                }

                currentStreamIndex = index;
                fallbackAttempted = false;
                isPlaying = false;

                updateActiveButton();

                if (!player) {
                    initJWPlayer(url);
                    setTimeout(() => {
                        if (player) {
                            player.play();
                            setStatus('লোড হচ্ছে...', 'loading');
                        }
                    }, 400);
                    return;
                }

                setStatus('লোড হচ্ছে...', 'loading');

                try {
                    player.load({ file: url, type: 'hls' });
                    setTimeout(() => {
                        try { player.play(); } catch (_) {}
                    }, 400);
                } catch (err) {
                    setStatus('❌ লোড করতে সমস্যা', 'error');
                }
            }

            // ===== সুইচ =====
            function switchToStream(index) {
                if (index === currentStreamIndex && player) {
                    try {
                        player.play();
                        return;
                    } catch (_) {}
                }
                loadStream(index);
            }

            // ===== অ্যাকটিভ বাটন আপডেট =====
            function updateActiveButton() {
                document.querySelectorAll('.stream-btn').forEach(btn => {
                    const idx = parseInt(btn.getAttribute('data-global-index'));
                    btn.classList.toggle('active', idx === currentStreamIndex);
                });
            }

            // ===== স্ট্যাটাস চেক (স্মার্ট রেট্রাই সহ) =====
            function checkStreamSimple(stream) {
                return new Promise((resolve) => {
                    if (!stream.urls || stream.urls.length === 0) {
                        resolve('off');
                        return;
                    }
                    const url = stream.urls[0];
                    if (!url) {
                        resolve('off');
                        return;
                    }
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => { controller.abort(); }, 6000);

                    fetch(url, {
                        method: 'HEAD',
                        signal: controller.signal,
                        cache: 'no-store',
                        mode: 'cors'
                    }).then(resp => {
                        clearTimeout(timeoutId);
                        resolve(resp.ok ? 'on' : 'off');
                    }).catch(() => {
                        clearTimeout(timeoutId);
                        try {
                            const xhr = new XMLHttpRequest();
                            xhr.open('HEAD', url, true);
                            xhr.timeout = 7000;
                            xhr.onload = function() {
                                resolve(xhr.status >= 200 && xhr.status < 300 ? 'on' : 'off');
                            };
                            xhr.onerror = function() { resolve('off'); };
                            xhr.ontimeout = function() { resolve('off'); };
                            xhr.send();
                        } catch (_) {
                            resolve('off');
                        }
                    });
                });
            }

            // রেট্রাই লজিক: প্রথম ৩ বার ২ সেকেন্ড পরপর, তারপর ১ মিনিট পর
            async function updateDotStatus(index) {
                const stream = allStreams[index];
                if (!stream) return;
                const btn = document.querySelector(`.stream-btn[data-global-index="${index}"]`);
                if (!btn) return;
                const dot = btn.querySelector('.status-dot');
                if (!dot) return;

                // রেট্রাই স্টেট ম্যানেজ
                if (!retryState.has(index)) {
                    retryState.set(index, { attempt: 0, timer: null });
                }
                const state = retryState.get(index);

                // চেক করার আগে ক্লিয়ার করে দিই
                if (state.timer) {
                    clearTimeout(state.timer);
                    state.timer = null;
                }

                const isFirst = !firstCheckDone.has(index);
                if (isFirst) {
                    dot.className = 'status-dot checking';
                    dot.innerHTML = '<span class="dot-label">⏳</span>';
                }

                const status = await checkStreamSimple(stream);
                dot.className = `status-dot ${status}`;
                dot.innerHTML = '<span class="dot-label">●</span>';
                statusCache.set(index, { status, checked: Date.now() });
                firstCheckDone.add(index);

                // রেট্রাই লজিক
                let nextInterval = 60000; // ডিফল্ট ১ মিনিট

                if (status === 'off') {
                    // অফ হলে ৩ বার ২ সেকেন্ড পরপর চেক
                    if (state.attempt < 3) {
                        state.attempt++;
                        nextInterval = 2000;
                    } else {
                        // ৩ বার失败後 ১ মিনিট
                        state.attempt = 0; // রিসেট
                        nextInterval = 60000;
                    }
                } else {
                    // অন থাকলে ১ মিনিট
                    state.attempt = 0;
                    nextInterval = 60000;
                }

                // টাইমার সেট
                const timer = setTimeout(() => {
                    updateDotStatus(index);
                }, nextInterval);
                state.timer = timer;
                statusCheckTimers.push(timer);
            }

            function startDotUpdates() {
                allStreams.forEach((_, idx) => {
                    updateDotStatus(idx);
                });
            }

            // ===== বিল্ড চ্যানেল বক্স =====
            function buildChannelBox(channelData, container) {
                const box = document.createElement('div');
                box.className = 'channel-box';

                const header = document.createElement('div');
                header.className = 'box-header';
                header.innerHTML = `
                        <div class="box-title">
                            <span class="box-icon-big">${channelData.icon || ''}</span>
                            ${channelData.name}
                            <span class="badge-count">${channelData.streams.length}</span>
                        </div>
                        <span class="box-icon">▾</span>
                    `;
                box.appendChild(header);

                const grid = document.createElement('div');
                grid.className = 'stream-grid';

                channelData.streams.forEach((stream) => {
                    const globalIdx = allStreams.findIndex(item =>
                        item.channelName === channelData.name &&
                        item.label === stream.label &&
                        item.sub === (stream.sub || '')
                    );

                    const btn = document.createElement('button');
                    btn.className = 'stream-btn' + (globalIdx === currentStreamIndex ? ' active' : '');
                    btn.setAttribute('data-global-index', globalIdx);

                    const dot = document.createElement('span');
                    dot.className = 'status-dot checking';
                    dot.innerHTML = '<span class="dot-label">⏳</span>';
                    btn.appendChild(dot);

                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'btn-icon';
                    iconSpan.textContent = stream.icon || '📺';

                    const labelSpan = document.createElement('span');
                    labelSpan.textContent = stream.label;
                    if (stream.sub) {
                        const subSpan = document.createElement('span');
                        subSpan.className = 'sub-label';
                        subSpan.textContent = stream.sub;
                        labelSpan.appendChild(subSpan);
                    }

                    btn.appendChild(iconSpan);
                    btn.appendChild(labelSpan);

                    btn.addEventListener('click', function(e) {
                        const idx = parseInt(this.getAttribute('data-global-index'));
                        switchToStream(idx);
                    });
                    btn.setAttribute('tabindex', '0');

                    grid.appendChild(btn);
                });

                box.appendChild(grid);
                container.appendChild(box);
            }

            // ===== বিল্ড লেআউট — সব CHANNELS রেন্ডার করে =====
            function buildLayout() {
                fifaCol.innerHTML = '';
                newsCol.innerHTML = '';
                indianCol.innerHTML = '';

                // CHANNELS[0] → ফিফা
                if (CHANNELS.length > 0) {
                    buildChannelBox(CHANNELS[0], fifaCol);
                }
                // CHANNELS[1] → বাংলাদেশি
                if (CHANNELS.length > 1) {
                    buildChannelBox(CHANNELS[1], newsCol);
                }
                // CHANNELS[2] → আন্তর্জাতিক
                if (CHANNELS.length > 2) {
                    buildChannelBox(CHANNELS[2], indianCol);
                }

                startDotUpdates();
            }

            // ===== প্রিলোডার =====
            setTimeout(() => {
                document.querySelectorAll('.line').forEach(l => l.style.width = '40%');
            }, 300);

            setTimeout(() => {
                const brand = document.getElementById('brand');
                const tagline = document.getElementById('tagline');
                brand.style.transition = 'opacity 0.8s ease';
                tagline.style.transition = 'opacity 0.8s ease';
                brand.style.opacity = 0;
                tagline.style.opacity = 0;
            }, 2200);

            setTimeout(() => {
                const brand = document.getElementById('brand');
                const tagline = document.getElementById('tagline');
                brand.innerHTML = 'RAS TV';
                tagline.innerHTML = 'Powered by .SIUM GROUP';
                brand.style.opacity = 0;
                brand.style.transform = 'scale(0.8)';
                tagline.style.opacity = 0;
                tagline.style.transform = 'translateY(20px)';
                brand.style.animation = 'none';
                tagline.style.animation = 'none';
                brand.offsetHeight;
                tagline.offsetHeight;
                brand.style.animation = 'zoomIn 1.2s ease-out forwards';
                tagline.style.animation = 'fadeUp 1.2s ease-out forwards 0.4s';
            }, 3200);

            setTimeout(() => {
                document.body.classList.add('loaded');
                document.getElementById('preloader').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';

                buildLayout();

                setStatus('প্রস্তুত — একটি চ্যানেল সিলেক্ট করুন', '');

                window.__player = { player, switchToStream, allStreams };

            }, 7000);

        })();

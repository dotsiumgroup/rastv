<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-family: Arial, sans-serif;
    }

    .player-box {
      width: 100%;
      max-width: 1000px;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>

  <div class="player-box">
    <video
      id="videoPlayer"
      controls
      autoplay
      playsinline
      preload="auto"
      controlsList="nodownload"
      oncontextmenu="return false;"
    >
      <source
        src="https://pub-4e135af7e68844d8816cb0f642379557.r2.dev/CINEFREAK.TOP%20-%20WALL-E%20%282008%29%20BluRay%20%5BHindi-English%5D%201080p%20ESub.mkv"
        type="video/mp4"
      >

      আপনার ব্রাউজার ভিডিও প্লেব্যাক 
    </video>
  </div>

  <script>
    const video = document.getElementById("videoPlayer");

    // Autoplay চেষ্টা
    window.addEventListener("load", () => {
      video.play().catch(() => {
        // Browser autoplay block করলে controls থেকে Play করা যাবে
      });
    });

    // Right-click বন্ধ
    video.addEventListener("contextmenu", e => {
      e.preventDefault();
    });
  </script>

</body>
</html>

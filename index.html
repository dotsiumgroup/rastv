<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>RAS LIVE TV — Auto Player</title>
    <link rel="shortcut icon" type="image/x-icon" href="https://i.postimg.cc/mD1VCt2C/RS-Live.png">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <style>
        /* ---------- PRELOADER STYLES ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #035c4a;
        }

        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #035c4a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 999999;
            transition: opacity 1.5s ease, transform 1.5s ease;
        }

        .brand {
            font-size: 8.4vw;
            font-weight: 900;
            color: #ffd700;
            letter-spacing: 0.15em;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            opacity: 0;
            transform: scale(0.8);
            animation: zoomIn 1.2s ease-out forwards 0.4s;
        }

        .tagline {
            font-size: 2.2vw;
            font-weight: 700;
            color: #bbb;
            letter-spacing: 0.4em;
            margin-top: 20px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1.2s ease-out forwards 1.2s;
            text-transform: uppercase;
        }

        .line {
            position: absolute;
            background: linear-gradient(to right, transparent, #ffd700, transparent);
            height: 1px;
            transition: width 1.2s ease-in-out;
        }

        .line.left {
            left: 0;
            top: 50%;
        }

        .line.right {
            right: 0;
            top: 50%;
        }

        @keyframes zoomIn {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loaded #preloader {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        /* ---------- MAIN CONTENT ---------- */
        #main-content {
            display: none;
            background: #000;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            color: #fff;
            padding-top: 10px;
            min-height: 100vh;
        }

        .tv-view .embed-responsive {
            border: 1px solid #222;
            border-radius: 8px;
            background: #000;
            overflow: hidden;
            position: relative;
        }
        .embed-responsive-16by9 {
            padding-bottom: 56.25%;
            height: 0;
        }
        .embed-responsive-16by9 video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0 !important;
            display: block;
            background: #000;
        }

        video::-webkit-media-controls { display: flex !important; }
        video::-webkit-media-controls-panel { background: linear-gradient(transparent, rgba(0,0,0,0.7)); }
        video::-webkit-media-controls-play-button { display: block !important; }
        video::-webkit-media-controls-volume-slider { display: block !important; }
        video::-webkit-media-controls-mute-button { display: block !important; }
        video::-webkit-media-controls-timeline { display: block !important; }
        video::-webkit-media-controls-current-time-display { display: block !important; }
        video::-webkit-media-controls-time-remaining-display { display: block !important; }
        video::-webkit-media-controls-fullscreen-button { display: block !important; }

        /* ===== লোডিং ওভারলে ===== */
        #rasLoadingOverlay {
            position: absolute;
            inset: 0;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            border-radius: inherit;
            pointer-events: none;
        }
        #rasLoadingOverlay.hidden {
            opacity: 0;
            visibility: hidden;
        }
        #rasLoadingOverlay .ras-loader { text-align: center; }
        #rasLoadingOverlay .ras-logo {
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            letter-spacing: 2px;
            margin-bottom: 10px;
            animation: rasGlow 1.5s ease-in-out infinite alternate;
        }
        #rasLoadingOverlay .ras-logo .ras { color: #fff; }
        #rasLoadingOverlay .ras-logo .live { color: #ff9100; text-shadow: 0 0 20px rgba(255,145,0,0.5); }
        #rasLoadingOverlay .ras-logo .tv { color: #00d2ff; text-shadow: 0 0 20px rgba(0,210,255,0.5); }
        @keyframes rasGlow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.08); opacity: 1; }
        }
        #rasLoadingOverlay .ras-spinner {
            width: 60px; height: 60px;
            margin: 10px auto;
            position: relative;
            animation: rasSpin 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
        }
        #rasLoadingOverlay .ras-spinner::before,
        #rasLoadingOverlay .ras-spinner::after {
            content: '';
            position: absolute;
            border-radius: 50%;
        }
        #rasLoadingOverlay .ras-spinner::before {
            top: 0; left: 0; width: 100%; height: 100%;
            border: 4px solid transparent;
            border-top-color: #ff9100;
            border-bottom-color: #00d2ff;
            animation: rasSpin 1.2s cubic-bezier(0.5,0,0.5,1) infinite;
        }
        #rasLoadingOverlay .ras-spinner::after {
            top: 8px; left: 8px; width: 44px; height: 44px;
            border: 4px solid transparent;
            border-left-color: #fff;
            border-right-color: #ff9100;
            animation: rasSpin 0.8s cubic-bezier(0.5,0,0.5,1) infinite reverse;
        }
        @keyframes rasSpin { to { transform: rotate(360deg); } }
        #rasLoadingOverlay .ras-status {
            color: #aaa; font-size: 14px; font-weight: 300;
            margin-top: 10px;
            animation: rasPulse 1.5s ease-in-out infinite;
        }
        #rasLoadingOverlay .ras-status span { color: #ff9100; font-weight: bold; }
        @keyframes rasPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ===== ফুটার ===== */
        .footer-premium {
            background: #0a0a0a;
            padding: 30px 0 40px 0;
            text-align: center;
            margin-top: 20px;
            border-top: 2px solid #1a1a1a;
        }
        .footer-premium .ras-brand {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #ff9100, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .footer-premium .developer {
            font-size: 18px;
            font-weight: 500;
            color: #ccc;
            letter-spacing: 2px;
            margin-bottom: 18px;
        }
        .footer-premium .developer span {
            background: linear-gradient(90deg, #ff9100, #ffcc00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* ===== Others Platform Box ===== */
        .others-platform-box {
            display: inline-block;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px 20px 14px;
            margin-top: 10px;
            background: #111;
        }
        .others-platform-box .box-title {
            font-size: 11px;
            font-weight: 600;
            color: #888;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .others-platform-box .server-buttons {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            gap: 10px;
        }
        .others-platform-box .server-btn {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            border-color: #ff9100;
            box-shadow: 0 0 12px rgba(255, 145, 0, 0.2);
            white-space: nowrap;
        }
        .others-platform-box .server-btn:hover {
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 0 25px rgba(255, 145, 0, 0.5);
            background: linear-gradient(135deg, #ff9100, #ffcc00);
            color: #000;
            border-color: #ffcc00;
        }
        .others-platform-box .server-btn.server-2 {
            border-color: #00d2ff;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.2);
        }
        .others-platform-box .server-btn.server-2:hover {
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.5);
            background: linear-gradient(135deg, #00d2ff, #00ff88);
            border-color: #00ff88;
            color: #000;
        }

        .footer-premium .copyright {
            color: #444;
            font-size: 11px;
            margin-top: 25px;
            letter-spacing: 1px;
        }
        .footer-premium .copyright span { color: #ff9100; }

        @media (max-width: 600px) {
            .footer-premium .ras-brand { font-size: 22px; }
            .footer-premium .developer { font-size: 15px; }
            .others-platform-box .server-btn {
                padding: 7px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="line left"></div>
        <div class="line right"></div>
        <div class="brand" id="brand">.SIUM GROUP</div>
        <div class="tagline" id="tagline">Crafted with Excellence</div>
    </div>

    <!-- MAIN CONTENT -->
    <div id="main-content">
        <div class="container tv-area">
            <div class="row">
                <div class="col-xs-12 tv-view">
                    <div class="embed-responsive embed-responsive-16by9">
                        <video id="playerFrame" playsinline controls></video>
                        <div id="rasLoadingOverlay">
                            <div class="ras-loader">
                                <div class="ras-logo">
                                    <span class="ras">RAS</span>
                                    <span class="live">LIVE</span>
                                    <span class="tv">TV</span>
                                </div>
                                <div class="ras-spinner"></div>
                                <div class="ras-status">চ্যানেল লোড হচ্ছে <span>✦</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer-premium">
            <div class="container">
                <div class="ras-brand">RAS LIVE TV</div>
                <div class="developer">
                    developed by <span>SAHIBUL MUSA SIUM</span>
                </div>

                <div class="others-platform-box">
                    <div class="box-title">Others Platform</div>
                    <div class="server-buttons">
                        <a href="https://livekhela.movielinkbd.li/" target="_blank" class="server-btn">
                            ⚡ SERVER 1
                        </a>
                        <a href="https://new.livekhelatv.com/" target="_blank" class="server-btn server-2">
                            🌐 SERVER 2
                        </a>
                    </div>
                </div>

                <div class="copyright">
                    © 2026 <span>TAS LIVE TV</span> | All Rights Reserved
                </div>
            </div>
        </footer>
    </div>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        (function() {
            // ===== PRELOADER =====
            setTimeout(() => {
                document.querySelectorAll('.line').forEach(l => l.style.width = '40%');
            }, 300);

            setTimeout(() => {
                const brand = document.getElementById('brand');
                const tagline = document.getElementById('tagline');
                brand.style.transition = 'opacity 0.8s ease';
                tagline.style.transition = 'opacity 0.8s ease';
                brand.style.opacity = 0;
                tagline.style.opacity = 0;
            }, 2200);

            setTimeout(() => {
                const brand = document.getElementById('brand');
                const tagline = document.getElementById('tagline');
                brand.innerHTML = 'RAS TV';
                tagline.innerHTML = 'Powered by .SIUM GROUP';
                brand.style.opacity = 0;
                brand.style.transform = 'scale(0.8)';
                tagline.style.opacity = 0;
                tagline.style.transform = 'translateY(20px)';
                brand.style.animation = 'none';
                tagline.style.animation = 'none';
                brand.offsetHeight;
                tagline.offsetHeight;
                brand.style.animation = 'zoomIn 1.2s ease-out forwards';
                tagline.style.animation = 'fadeUp 1.2s ease-out forwards 0.4s';
            }, 3200);

            setTimeout(() => {
                document.body.classList.add('loaded');
                document.getElementById('preloader').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                initPlayer();
            }, 7000);

            // ===== PLAYER =====
            function initPlayer() {
                const STREAMS = [
                    'https://d1211whpimeups.cloudfront.net/smil:rtbgo/chunklist_b4096000_slENG.m3u8',
                    'https://d1211whpimeups.cloudfront.net/smil:rtbgo/chunklist_b2196000_sleng.m3u8',
                    'https://1nyaler.streamhostingcdn.top/stream/94/index.m3u8'
                ];

                const BUFFER_TIMEOUT = 15000;
                const video = document.getElementById('playerFrame');
                const overlay = document.getElementById('rasLoadingOverlay');

                let currentStreamIndex = 0;
                let hls = null;
                let isPlaying = false;
                let bufferTimer = null;
                let isBuffering = false;
                let isLoading = false;

                function loadStream(index) {
                    if (isLoading) return;
                    isLoading = true;
                    if (overlay) overlay.classList.remove('hidden');
                    if (hls) { hls.destroy(); hls = null; }

                    const url = STREAMS[index];

                    if (Hls.isSupported()) {
                        hls = new Hls({
                            enableWorker: true,
                            lowLatencyMode: true,
                            abrEwmaDefaultEstimate: 500000,
                            abrEwmaSlowVoD: 3,
                            abrEwmaFastLive: 1,
                            abrMaxWithRealBitrate: true,
                            maxBufferLength: 30,
                            maxMaxBufferLength: 60,
                        });
                        hls.loadSource(url);
                        hls.attachMedia(video);

                        hls.on(Hls.Events.MANIFEST_PARSED, function() {
                            video.play().then(() => {
                                isPlaying = true;
                                isLoading = false;
                                if (overlay) overlay.classList.add('hidden');
                                clearBufferTimer();
                            }).catch(() => {
                                isLoading = false;
                                if (overlay) overlay.classList.add('hidden');
                            });
                        });

                        hls.on(Hls.Events.ERROR, function(event, data) {
                            if (data.fatal) {
                                setTimeout(() => {
                                    if (overlay) overlay.classList.add('hidden');
                                    isLoading = false;
                                    switchStream();
                                }, 5000);
                            }
                        });

                        video.addEventListener('loadeddata', () => { if (overlay) overlay.classList.add('hidden'); isLoading = false; clearBufferTimer(); });
                        video.addEventListener('canplay', () => { if (overlay) overlay.classList.add('hidden'); isLoading = false; clearBufferTimer(); if (isBuffering) { isBuffering = false; } });
                        video.addEventListener('playing', () => { if (overlay) overlay.classList.add('hidden'); isPlaying = true; isLoading = false; clearBufferTimer(); if (isBuffering) { isBuffering = false; } });

                        video.addEventListener('waiting', () => {
                            if (isBuffering) return;
                            isBuffering = true;
                            if (overlay) overlay.classList.remove('hidden');
                            clearBufferTimer();
                            bufferTimer = setTimeout(() => {
                                isBuffering = false;
                                if (overlay) overlay.classList.add('hidden');
                                switchStream();
                            }, BUFFER_TIMEOUT);
                        });

                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                        video.load();
                        video.play().then(() => {
                            isPlaying = true;
                            isLoading = false;
                            if (overlay) overlay.classList.add('hidden');
                            clearBufferTimer();
                        }).catch(() => {
                            isLoading = false;
                            if (overlay) overlay.classList.add('hidden');
                        });
                    } else {
                        alert('আপনার ব্রাউজার HLS স্ট্রিম সাপোর্ট করে না।');
                        isLoading = false;
                        if (overlay) overlay.classList.add('hidden');
                    }
                }

                function switchStream() {
                    clearBufferTimer();
                    isBuffering = false;
                    isLoading = false;
                    currentStreamIndex = (currentStreamIndex + 1) % STREAMS.length;
                    video.pause();
                    video.removeAttribute('src');
                    video.load();
                    setTimeout(() => loadStream(currentStreamIndex), 1000);
                }

                function clearBufferTimer() {
                    if (bufferTimer) { clearTimeout(bufferTimer); bufferTimer = null; }
                }

                video.muted = false;
                video.volume = 1;
                loadStream(0);

                video.addEventListener('ended', switchStream);
                video.addEventListener('error', () => { if (!isLoading) switchStream(); });
                video.addEventListener('dblclick', () => {
                    if (!document.fullscreenElement) video.requestFullscreen().catch(() => {});
                    else document.exitFullscreen().catch(() => {});
                });
            }
        })();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Player</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="/rastv/manifest.json">
<meta name="theme-color" content="#000000">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b0b;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      font-family: Arial, sans-serif;
    }

    .player-box {
      width: 100%;
      max-width: 1000px;
      background: #111;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,.5);
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>

  <div class="player-box">
    <video
      id="videoPlayer"
      controls
      autoplay
      playsinline
      preload="auto"
      controlsList="nodownload"
      oncontextmenu="return false;"
    >
      <source
        src="https://fsldownload.com/p/yVA7uyhePCn8uPIi.dIvLL9KrkaBTqUfh8m3IGmyrK7uCfP5UQ_j1oR9rkKQT2hWG0MJX8u2Lu-J1DH-EHRZX6HoZUW1pABqaFT_L0cuKXyRHDs1PtHDUsfcn07ulIiClr646WjK8zI_kzyu9mZvs2qhknl2immieN6Ef-zR5KNaA65_0ikXBXtmQBQqZU_h1lzcZpFaM66-CzdVxXosVqGEcb1LkbJc1FzElMi3XW-keXaogvw5kcQ9UzRBmd8riYPS3PwR-oRsbcIZSBkU71HA_rhSQnQFFxRa-5ICfAAyOygSr2w.qo_bsAo8DtTHbfidRsiIEQ"
        type="video/mp4"
      >

      আপনার ব্রাউজার ভিডিও প্লেব্যাক 
    </video>
  </div>

  <script>
    const video = document.getElementById("videoPlayer");

    // Autoplay চেষ্টা
    window.addEventListener("load", () => {
      video.play().catch(() => {
        // Browser autoplay block করলে controls থেকে Play করা যাবে
      });
    });

    // Right-click বন্ধ
    video.addEventListener("contextmenu", e => {
      e.preventDefault();
    });
  </script>

</body>
</html>
